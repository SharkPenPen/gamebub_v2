name: Firmware

# GitHub only reads workflows from the repository root, so this is the file that
# actually runs. It replaces the copy that used to live in firmware/handheld/.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned to the 3.x line on purpose: espflash.toml uses the 3.x layout, and
  # espflash 4 refuses to run unless bootloader/partition_table move into an
  # [idf_format_args] table.
  ESPFLASH_VERSION: v3.3.0

jobs:
  firmware:
    name: ESP32-S3 firmware (rev2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/handheld
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release --features=rev2
          - command: fmt
            args: --all -- --check --color always
          # Warnings are reported but do not fail the build: the imported upstream
          # code carries 56 of them, and failing on those would bury real compile
          # errors. Deny-level lints still fail, except for unused_io_amount,
          # which upstream trips in the bitstream readers (11 sites).
          - command: clippy
            args: --all-targets --workspace --features=rev2 -- -A clippy::unused_io_amount
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Install the toolchain first: rust-cache shells out to `cargo metadata`,
      # which fails on rust-toolchain.toml until the esp toolchain exists.
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/handheld
          # ESP-IDF and its tools are the slow part of a cold build.
          cache-directories: |
            ~/.espressif
            ~/.embuild
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

      # --- Only the build job has something to hand out ---------------------
      # One merged image to write at 0x0: the prebuilt bootloader, the partition
      # table from partitions.csv and the application, in a single file.
      # --skip-padding keeps it the size of its contents instead of padding to the
      # configured flash size, so it is safe on both 4 MB and 8 MB parts.
      #
      # What merging costs: every gap is filled with 0xFF, including nvs_ro
      # (serial, hardware revision) and nvs (settings), so a device flashed this way
      # reports no revision and starts with default settings. The firmware is written
      # to warn and boot anyway, and flash_nvs.py can put the factory data back.
      - name: Install espflash
        if: matrix.action.command == 'build'
        run: |
          curl -sL -o /tmp/cargo-espflash.zip "https://github.com/esp-rs/espflash/releases/download/${ESPFLASH_VERSION}/cargo-espflash-x86_64-unknown-linux-gnu.zip"
          unzip -oq /tmp/cargo-espflash.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/cargo-espflash"
          cargo espflash --version

      - name: Build the merged image
        if: matrix.action.command == 'build'
        run: |
          cargo espflash save-image --chip esp32s3 --merge --skip-padding \
            --release --features=rev2 gamebub-rev2.bin
          ls -l gamebub-rev2.bin
          sha256sum gamebub-rev2.bin

      # Read the image back before publishing it: espflash would happily emit an
      # image for the wrong crate, or ignore espflash.toml, and the result would
      # only show up as a device that does not boot.
      - name: Check the image
        if: matrix.action.command == 'build'
        run: |
          python3 - <<'PY'
          import hashlib, os, struct
          data = open('gamebub-rev2.bin', 'rb').read()
          print('bytes :', len(data))
          print('sha256:', hashlib.sha256(data).hexdigest())
          assert data[0] == 0xE9, 'no ESP image at 0x0'
          table = data[0x8000:0x9000]
          entries = []
          for i in range(0, len(table) - 32, 32):
              entry = table[i:i + 32]
              if entry[:2] != b'\xaa\x50':
                  break
              offset, size = struct.unpack('<II', entry[4:12])
              name = entry[12:28].rstrip(b'\x00').decode()
              entries.append((name, offset, size))
          print('partitions :', [(n, hex(o)) for n, o, _ in entries])
          assert entries and entries[0][0] == 'nvs_ro' and entries[0][1] == 0x9000, \
              'the partition table at 0x8000 is not this project\'s'
          apps = [e for e in entries if e[0] == 'factory']
          assert apps, 'no factory application partition'
          offset = apps[0][1]
          assert offset == 0x30000, 'app partition at ' + hex(offset) + ', expected 0x30000'
          assert data[offset] == 0xE9, 'no application image at ' + hex(offset)
          desc = data.find(struct.pack('<I', 0xABCD5432), offset, offset + 64)
          if desc < 0:
              print('warning: no application descriptor found')
          else:
              version = data[desc + 16:desc + 48].rstrip(b'\x00').decode()
              project = data[desc + 48:desc + 80].rstrip(b'\x00').decode()
              print('app        :', project, '| version:', version)
              expected = os.environ.get('GITHUB_SHA', '')[:7]
              if expected:
                  print('built from this commit:', version.startswith(expected))
          print('MERGED IMAGE OK - flash at 0x0')
          PY

      - name: Upload the merged image
        if: matrix.action.command == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: gamebub-rev2-firmware
          path: firmware/handheld/gamebub-rev2.bin
          if-no-files-found: error
