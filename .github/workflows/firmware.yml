name: Firmware

# GitHub only reads workflows from the repository root, so this is the file that
# actually runs. It replaces the copy that used to live in firmware/handheld/.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  firmware:
    name: ESP32-S3 firmware (rev2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/handheld
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release --features=rev2
          - command: fmt
            args: --all -- --check --color always
          # Advisory only: the imported upstream code carries pre-existing clippy
          # warnings, and failing the build on those would bury real compile
          # errors. Restore `-- -D warnings` once they have been cleaned up.
          - command: clippy
            args: --all-targets --workspace --features=rev2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/handheld
          # ESP-IDF and its tools are the slow part of a cold build.
          cache-directories: |
            ~/.espressif
            ~/.embuild
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}
